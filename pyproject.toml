[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "bound-rmt"
version = "0.0.2"
description = "Recurrent Qwen3 with bound, token-routed transformer experts"
requires-python = ">=3.11,<3.14"
dependencies = ["torch==2.10.0", "transformers==4.57.6", "safetensors==0.8.0", "PyYAML==6.0.3", "accelerate==1.13.0"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
